name: Portal security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate portal JavaScript and security policy
        run: |
          node --check portal.js
          node --check sw.js
          node --check captcha.js
          node --check security-config.js
          sh scripts/build-pages.sh
          test -f dist/_headers && test -f dist/captcha.js
          node --test tests/security.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json'))"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          assert 'Content-Security-Policy' in html
          assert "script-src 'self'" in html
          assert "object-src 'none'" in html
          assert all(not body.strip() for body in re.findall(r'<script\b[^>]*>(.*?)</script\s*>', html, re.I | re.S)), 'Unexpected inline JavaScript'
          for p in [Path('index.html'), Path('portal.js'), Path('sw.js')]:
              content = p.read_text()
              assert not re.search(r'sb_secret_[A-Za-z0-9_-]{12,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', content), 'Potential secret in ' + str(p)
          print('Portal security baseline passed')
          PY
  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          category: /language:${{ matrix.language }}
