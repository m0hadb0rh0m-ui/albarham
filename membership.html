<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة العضوية | آل برهم</title><style>body{margin:0;background:#f6f2e9;color:#123b32;font:17px Tahoma,Arial;line-height:1.8}header{background:#123b32;color:#e6cc98;padding:24px;text-align:center}main{max-width:520px;margin:32px auto;padding:24px;background:white;border:1px solid #c4a56a;border-radius:16px}label{display:block;margin:12px 0}input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:6px;font:inherit}button{background:#123b32;color:white;padding:12px 20px;border:0;border-radius:6px;font:inherit;cursor:pointer;margin:6px}a{color:inherit} [hidden]{display:none!important}#msg{white-space:pre-wrap}</style></head><body><header><a href="./">آل برهم</a><h1>بوابة العضوية</h1></header><main><p id="msg" role="status"></p><div id="guest"><button id="showLogin">تسجيل الدخول</button><button id="showRegister">إنشاء حساب</button><form id="login"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button>دخول</button></form><form id="register" hidden><label>الاسم الرباعي<input name="full_name" required maxlength="150"></label><label>الهاتف بالمقدمة الدولية<input name="phone" type="tel" placeholder="+970" required></label><label>واتساب بالمقدمة الدولية<input name="whatsapp" type="tel"></label><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" minlength="10" required></label><label>تأكيد كلمة المرور<input name="confirm" type="password" minlength="10" required></label><p>تستخدم بيانات التواصل لمراجعة طلب العضوية. هذه بوابة تجريبية؛ لا تدخل رقم الهوية أو وثائق شخصية.</p><label><input name="consent" type="checkbox" required> أوافق على استخدام بياناتي لمراجعة الطلب التجريبي.</label><button>إنشاء الحساب</button></form></div><div id="member" hidden><h2>حسابي</h2><p id="status"></p><button id="apply" hidden>إرسال طلب العضوية</button><button id="logout">تسجيل الخروج</button></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qwvijrhsbranemkkzddk.supabase.co','sb_publishable_HwkES4Bc1FnTHcXwt1OkmA_zscGlKYZ');const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;function run(fn){return async e=>{e?.preventDefault();try{await fn(e)}catch(err){msg('تعذر إتمام العملية: '+err.message)}}} $('showLogin').onclick=()=>{$('login').hidden=false;$('register').hidden=true};$('showRegister').onclick=()=>{$('login').hidden=true;$('register').hidden=false};$('register').onsubmit=run(async e=>{const f=Object.fromEntries(new FormData(e.target));if(f.password!==f.confirm)throw Error('كلمتا المرور غير متطابقتين');const{error}=await s.auth.signUp({email:f.email,password:f.password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:f.full_name,phone:f.phone,whatsapp:f.whatsapp}}});if(error)throw error;e.target.reset();msg('تحقق من بريدك الإلكتروني لتأكيد الحساب، ثم سجل الدخول.');await refresh()});$('login').onsubmit=run(async e=>{const f=Object.fromEntries(new FormData(e.target));const{error}=await s.auth.signInWithPassword(f);if(error)throw error;e.target.reset();msg('');await refresh()});async function refresh(){const{data:{user}}=await s.auth.getUser();$('guest').hidden=!!user;$('member').hidden=!user;if(!user)return;const a=await s.from('membership_applications').select('status').eq('user_id',user.id).maybeSingle();if(a.error)throw a.error;const m=await s.from('memberships').select('membership_number,status').eq('user_id',user.id).maybeSingle();if(m.error)throw m.error;const labels={under_review:'قيد المراجعة',more_information:'مطلوب استكمال',approved:'معتمد',rejected:'غير معتمد',active:'نشطة',suspended:'موقوفة',revoked:'ملغاة'};$('status').textContent=m.data?'رقم العضوية: '+m.data.membership_number+' — '+labels[m.data.status]:a.data?'حالة الطلب: '+labels[a.data.status]:'لم ترسل طلب عضوية بعد';$('apply').hidden=!!a.data||!!m.data} $('apply').onclick=run(async()=>{const{data:{user}}=await s.auth.getUser();if(!user)throw Error('سجل الدخول أولا');const p=await s.from('member_profiles').upsert({id:user.id,full_name:user.user_metadata.full_name,phone:user.user_metadata.phone,whatsapp:user.user_metadata.whatsapp});if(p.error)throw p.error;const a=await s.from('membership_applications').insert({user_id:user.id});if(a.error)throw a.error;msg('تم إرسال الطلب للمراجعة');await refresh()});$('logout').onclick=run(async()=>{const{error}=await s.auth.signOut();if(error)throw error;msg('');await refresh()});run(refresh)();</script></body></html>
